line-height:1.5}.lock-form{flex-direction:column;gap:12px;display:flex}.lock-form input{border:1px solid color-mix(in srgb,var(--soft) 45%,transparent);width:100%;color:var(--fg);font:inherit;text-align:center;letter-spacing:.16em;background:0 0;border-radius:10px;outline:none;padding:13px 15px;font-size:1rem}.lock-form input:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}.lock-form button{background:var(--fg);color:var(--bg);cursor:pointer;border:0;border-radius:10px;padding:13px 16px;font:600 1rem Nunito,system-ui,sans-serif;transition:transform .2s,opacity .2s}.lock-form button:hover{opacity:.9;transform:translateY(-1px)}.lock-error{min-height:1.4em;color:#b34b3f!important;margin:2px 0 0!important;font-size:.9rem!important}.sr-only{clip:rect(0,0,0,0);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}[hidden]{display:none!important}</style>

      passwordInput.value = ''
    } else {
      lockError.textContent = 'Senha incorreta. Tenta novamente.'
      passwordInput.select()
    }
  })
</script>
